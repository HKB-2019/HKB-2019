# Weekly checks for updates to the shop's building blocks. Each update arrives
# as a pull request, and the tests run on it before anything is merged —
# nothing changes on the live shop until someone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Lagos
    # Small updates together in one pull request; a new major version on its
    # own, since those are the ones that can break things.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Lagos

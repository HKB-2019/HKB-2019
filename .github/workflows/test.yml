# Runs every test on every push: the API tests against both databases, then
# the browser tests. A red cross on a commit means something broke.
name: Tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: masq
          POSTGRES_PASSWORD: masq
          POSTGRES_DB: masq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U masq" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: API tests, built-in database
        run: npm test
      - name: API tests, real Postgres
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://masq:masq@localhost:5432/masq_test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
